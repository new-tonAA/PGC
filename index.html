<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCG World - 程序化内容生成</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        #ui-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            min-width: 230px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 100;
            user-select: none;
        }
        #ui-panel::-webkit-scrollbar { width: 4px; }
        #ui-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        #ui-panel h1 {
            font-size: 18px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #ui-panel .subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 14px;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 4px;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #7b2ff7;
        }
        .control-group .value {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            float: right;
        }
        .btn-row {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .btn {
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.15); }
        .btn.active {
            background: linear-gradient(135deg, #7b2ff7, #00d2ff);
            border-color: transparent;
        }
        .btn-toggle {
            padding: 5px 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn-toggle:hover { background: rgba(255,255,255,0.15); }
        .btn-toggle.active {
            background: linear-gradient(135deg, #ff8800, #ff4400);
            border-color: transparent;
        }
        .btn-regen {
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #7b2ff7, #00d2ff);
            border: none;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        .btn-regen:hover { opacity: 0.85; }

        .separator {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 8px 0;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            z-index: 999;
            transition: opacity 0.5s;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #7b2ff7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>PCG World 加载中...</div>
    </div>

    <div id="ui-panel">
        <h1>PCG World</h1>
        <div class="subtitle">Procedural Content Generation</div>

        <div class="control-group">
            <label>地形</label>
            <div class="btn-row">
                <button class="btn active" data-terrain="plains">平原</button>
                <button class="btn" data-terrain="mountains">山脉</button>
                <button class="btn" data-terrain="islands">岛屿</button>
                <button class="btn" data-terrain="suburban">近郊</button>
                <button class="btn" data-terrain="city">城市</button>
            </div>
        </div>

        <div class="control-group">
            <label>聚落风格</label>
            <div class="btn-row">
                <button class="btn active" data-settlement="village">村庄</button>
                <button class="btn" data-settlement="suburban">郊区</button>
                <button class="btn" data-settlement="city">城市</button>
            </div>
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>房屋数量 <span class="value" id="houseCountVal">8</span></label>
            <input type="range" id="houseCount" min="1" max="40" value="8">
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>天气效果</label>
            <div class="btn-row">
                <button class="btn active" data-weather="clear">晴天</button>
                <button class="btn" data-weather="rain">雨天</button>
                <button class="btn" data-weather="snow">雪天</button>
                <button class="btn" data-weather="fog">雾天</button>
            </div>
        </div>

        <div class="control-group">
            <label>特效</label>
            <div class="btn-row">
                <button class="btn-toggle" id="toggleFire">火焰</button>
                <button class="btn-toggle" id="toggleLights">灯光</button>
            </div>
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>时间 <span class="value" id="timeVal">12:00</span></label>
            <input type="range" id="timeSlider" min="0" max="24" value="12" step="0.5">
        </div>

        <div class="control-group">
            <label>世界种子 <span class="value" id="seedVal">42</span></label>
            <input type="range" id="seedSlider" min="1" max="999" value="42">
        </div>

        <button class="btn-regen" id="regenerate">重新生成世界</button>
    </div>

    <div id="info">鼠标左键旋转 · 右键平移 · 滚轮缩放</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
