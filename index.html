<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCG World - Procedural Content Generation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #111; font-family: 'Consolas', 'Courier New', monospace; }
        canvas { display: block; }

        #ui-panel {
            position: fixed;
            top: 8px;
            left: 8px;
            background: rgba(10,10,10,0.92);
            border: 1px solid #333;
            border-radius: 2px;
            padding: 6px 8px;
            color: #ccc;
            min-width: 180px;
            max-height: 95vh;
            overflow-y: auto;
            z-index: 100;
            user-select: none;
            font-size: 11px;
            line-height: 1.3;
        }
        #ui-panel::-webkit-scrollbar { width: 3px; }
        #ui-panel::-webkit-scrollbar-thumb { background: #555; }
        #ui-panel h1 {
            font-size: 12px;
            margin-bottom: 2px;
            color: #0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #ui-panel .subtitle {
            font-size: 9px;
            color: #888;
            margin-bottom: 6px;
        }
        .control-group {
            margin-bottom: 4px;
        }
        .control-group label {
            display: block;
            font-size: 10px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .control-group input[type="range"] {
            width: 100%;
            accent-color: #0f0;
            height: 3px;
        }
        .control-group .value {
            font-size: 9px;
            color: #0f0;
            float: right;
        }
        .btn-row {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }
        .btn {
            padding: 2px 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #aaa;
            border-radius: 1px;
            cursor: pointer;
            font-size: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            transition: all 0.1s;
        }
        .btn:hover { background: #333; color: #fff; }
        .btn.active {
            background: #0a0;
            border-color: #0f0;
            color: #fff;
        }
        .btn-toggle {
            padding: 2px 6px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #aaa;
            border-radius: 1px;
            cursor: pointer;
            font-size: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            transition: all 0.1s;
        }
        .btn-toggle:hover { background: #333; color: #fff; }
        .btn-toggle.active {
            background: #c40;
            border-color: #f60;
            color: #fff;
        }

        .separator {
            height: 1px;
            background: #333;
            margin: 4px 0;
        }

        #info {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: #555;
            font-size: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
            text-align: center;
            pointer-events: none;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #0f0;
            font-family: 'Consolas', 'Courier New', monospace;
            z-index: 999;
            transition: opacity 0.5s;
        }
        #loading .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #333;
            border-top-color: #0f0;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading PCG World...</div>
    </div>

    <div id="ui-panel">
        <h1>PCG WORLD</h1>
        <div class="subtitle">Procedural Content Generation</div>

        <div class="control-group">
            <label>TERRAIN</label>
            <div class="btn-row">
                <button class="btn active" data-terrain="plains">PLAINS</button>
                <button class="btn" data-terrain="mountains">MOUNTAINS</button>
                <button class="btn" data-terrain="islands">ISLANDS</button>
                <button class="btn" data-terrain="coastal">COASTAL</button>
                <button class="btn" data-terrain="suburban">SUBURB</button>
                <button class="btn" data-terrain="city">CITY</button>
            </div>
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>HOUSES <span class="value" id="houseCountVal">8</span></label>
            <input type="range" id="houseCount" min="1" max="40" value="8">
        </div>

        <div class="control-group">
            <label>VEHICLES <span class="value" id="vehicleCountVal">5</span></label>
            <input type="range" id="vehicleCount" min="0" max="15" value="5">
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>WEATHER</label>
            <div class="btn-row">
                <button class="btn active" data-weather="clear">CLEAR</button>
                <button class="btn" data-weather="rain">RAIN</button>
                <button class="btn" data-weather="snow">SNOW</button>
            </div>
        </div>

        <div class="control-group">
            <label>FX</label>
            <div class="btn-row">
                <button class="btn-toggle" id="toggleFire">FIRE</button>
                <button class="btn-toggle" id="toggleLights">LIGHT</button>
            </div>
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <label>TIME <span class="value" id="timeVal">12:00</span></label>
            <input type="range" id="timeSlider" min="0" max="24" value="12" step="0.5">
        </div>

        <div class="control-group">
            <label>SEED <span class="value" id="seedVal">42</span></label>
            <input type="range" id="seedSlider" min="1" max="999" value="42">
        </div>

    </div>

    <div id="info">LMB: Rotate · RMB: Pan · Scroll: Zoom</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
    <script>
        window.addEventListener('error', function(e) {
            console.error('JS Error:', e.message, e.filename, e.lineno);
            var loading = document.getElementById('loading');
            if (loading) {
                loading.innerHTML = '<div style="color:#ff4444;font-size:14px;text-align:center;padding:20px;">Load failed, press F12 for console<br><br>' + e.message + '</div>';
            }
        });
        setTimeout(function() {
            var loading = document.getElementById('loading');
            if (loading && loading.style.display !== 'none') {
                loading.innerHTML = '<div style="color:#ffaa00;font-size:14px;text-align:center;padding:20px;">Load timeout, press F12 for console</div>';
            }
        }, 15000);
    </script>
</body>
</html>
